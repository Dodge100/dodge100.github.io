<svg
    xmlns="http://www.w3.org/2000/svg"
    id="root"
    viewBox="0 0 360 360"
    fill="none"
>
    <defs>
        <filter
            id="noise-filter"
            x="0%"
            y="0%"
            width="100%"
            height="100%"
            filterUnits="objectBoundingBox"
            primitiveUnits="userSpaceOnUse"
            color-interpolation-filters="linearRGB"
        >
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.2"
                numOctaves="4"
                seed="15"
                stitchTiles="stitch"
                x="0%"
                y="0%"
                width="100%"
                height="100%"
                result="turbulence"
            ></feTurbulence>
            <feSpecularLighting
                surfaceScale="16"
                specularConstant="3"
                specularExponent="20"
                lighting-color="#666666"
                x="0%"
                y="0%"
                width="100%"
                height="100%"
                in="turbulence"
                result="specularLighting"
            >
                <feDistantLight azimuth="3" elevation="135"></feDistantLight>
            </feSpecularLighting>
        </filter>
    </defs>
    <!-- display area -->
    <rect
        x="29"
        y="59"
        width="302"
        height="222"
        rx="14"
        fill="var(--canvas-bg)"
        stroke="var(--primary-line)"
        stroke-width="1.5"
    />
    <rect
        x="29"
        y="59"
        width="302"
        height="222"
        rx="14"
        fill="red"
        filter="url(#noise-filter)"
        opacity="0.7"
        pointer-events="none"
    />
    <!-- camera innards -->
    <rect
        x="155"
        y="269"
        width="50"
        height="12"
        rx="2"
        fill="var(--primary-fill)"
        stroke="var(--primary-line)"
        stroke-width="0.8"
    />
    <rect
        x="165"
        y="272"
        width="30"
        height="6"
        rx="1"
        fill="var(--canvas-bg)"
        stroke="var(--primary-line)"
        stroke-width="0.3"
    />
</svg>
